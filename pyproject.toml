[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portcullis-scanner"
version = "0.1.0"
description = "Static security analyzer for CI/CD pipeline definitions: GitHub Actions, GitLab CI, and Jenkins."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Portcullis contributors" }]
keywords = ["security", "ci", "cd", "pipeline", "github-actions", "gitlab-ci", "jenkins", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Dependency policy: stdlib-first. ruamel.yaml is the single runtime dependency,
# chosen over PyYAML because its round-trip loader preserves line and column
# numbers for every node — Portcullis's evidence model requires accurate
# file:line traceability for each finding, which PyYAML cannot provide.
dependencies = ["ruamel.yaml>=0.18,<0.19"]

[project.optional-dependencies]
# jsonschema is dev-only: it validates the SARIF output against the official
# SARIF 2.1.0 schema in the test suite. It is never imported by the tool itself
# (the offline, stdlib-first runtime keeps its single dependency, ruamel.yaml).
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "jsonschema>=4.0"]

[project.scripts]
portcullis = "portcullis.cli:main"

[project.urls]
Homepage = "https://github.com/portcullis-scanner/portcullis"

[tool.setuptools.packages.find]
include = ["portcullis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
