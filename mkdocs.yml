site_name: Portcullis
site_description: Static security analyzer for CI/CD pipeline definitions (GitHub Actions, GitLab CI, Jenkins)
site_url: https://mk12002.github.io/Portcullis/
repo_url: https://github.com/mk12002/Portcullis
repo_name: mk12002/Portcullis
copyright: Apache-2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

# Repo-only docs that aren't part of the published site (blogs, build spec,
# the committed sample report). They stay in the repo but are excluded here.
exclude_docs: |
  content/
  spec/
  sample-report/

nav:
  - Home: index.md
  - Installation: installation.md
  - CLI Reference: cli.md
  - Python API: api.md
  - Examples: examples.md
  - Architecture: architecture.md
  - Detection Rules: rules.md
  - Benchmarks: benchmarks.md
  - Real-world Evaluation: EVALUATION.md
  - Comparison: COMPARISON.md
  - Threat Model: THREAT_MODEL.md
  # CONTRIBUTING.md and CHANGELOG.md live at the repo root (GitHub convention),
  # outside docs_dir, so the site links to them on GitHub.
  - Contributing: https://github.com/mk12002/Portcullis/blob/main/CONTRIBUTING.md
  - Changelog: https://github.com/mk12002/Portcullis/blob/main/CHANGELOG.md
