<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="920" height="560" rx="12" fill="#12151a"/>

  <!-- header -->
  <text x="30" y="44" fill="#e6e9ed" font-size="19" font-weight="700">Portcullis — pipeline security report</text>
  <text x="30" y="66" fill="#9aa4b2" font-size="11.5">target: tests/fixtures/github · portcullis v0.1.0 · platforms: github · files scanned: 2</text>

  <!-- score card -->
  <rect x="30" y="88" width="200" height="130" rx="10" fill="#1b2027" stroke="#2b323c"/>
  <text x="130" y="146" text-anchor="middle" fill="#e5484d" font-size="42" font-weight="700">0<tspan fill="#9aa4b2" font-size="17">/100</tspan></text>
  <text x="130" y="172" text-anchor="middle" fill="#e6e9ed" font-size="12">pipeline security score</text>
  <text x="130" y="196" text-anchor="middle" fill="#6f7d8f" font-size="9.5">max(0, 100 − 30·P0 − 15·P1 − 5·P2 − 1·P3)</text>

  <!-- headline card -->
  <rect x="250" y="88" width="640" height="130" rx="10" fill="#1b2027" stroke="#2b323c"/>
  <g font-size="12.5" font-weight="700">
    <rect x="272" y="108" width="70" height="24" rx="12" fill="#e5484d"/><text x="307" y="125" text-anchor="middle" fill="#fff">P0: 6</text>
    <rect x="350" y="108" width="70" height="24" rx="12" fill="#e8883a"/><text x="385" y="125" text-anchor="middle" fill="#fff">P1: 4</text>
    <rect x="428" y="108" width="70" height="24" rx="12" fill="#d8b135"/><text x="463" y="125" text-anchor="middle" fill="#1b1b1b">P2: 0</text>
    <rect x="506" y="108" width="70" height="24" rx="12" fill="#6f7d8f"/><text x="541" y="125" text-anchor="middle" fill="#fff">P3: 1</text>
  </g>
  <text x="272" y="162" fill="#e6e9ed" font-size="12.5">6 finding(s) at P0 — most urgent: Job 'triage' runs on pull_request_target (secrets and a</text>
  <text x="272" y="180" fill="#e6e9ed" font-size="12.5">privileged token available) and checks out PR-head code — attacker-controlled code</text>
  <text x="272" y="198" fill="#e6e9ed" font-size="12.5">executes in a privileged context (pwn-request pattern).</text>

  <!-- table header -->
  <g fill="#9aa4b2" font-size="10" font-weight="600" letter-spacing="0.5">
    <text x="34" y="256">PRIORITY</text>
    <text x="112" y="256">RULE</text>
    <text x="205" y="256">FILE</text>
    <text x="430" y="256">SEVERITY</text>
    <text x="540" y="256">CONFIDENCE</text>
    <text x="650" y="256">UNTRUSTED</text>
    <text x="745" y="256">FINDING</text>
  </g>
  <line x1="30" y1="266" x2="890" y2="266" stroke="#2b323c"/>

  <!-- rows -->
  <g font-size="11.5">
    <rect x="34" y="280" width="42" height="20" rx="10" fill="#e5484d"/><text x="55" y="294" text-anchor="middle" fill="#fff" font-weight="700">P0</text>
    <text x="112" y="294" fill="#e6e9ed">R1 pwn-request</text>
    <text x="205" y="294" fill="#4f8cc9" font-family="Consolas, monospace" font-size="10.5">vulnerable.yml:21</text>
    <text x="430" y="294" fill="#e6e9ed">CRITICAL</text>
    <text x="540" y="294" fill="#46a758">HIGH</text>
    <text x="650" y="294" fill="#e5484d" font-weight="700">YES</text>
    <text x="745" y="294" fill="#c8d1dc">PR-head checkout w/ secrets</text>

    <line x1="30" y1="310" x2="890" y2="310" stroke="#232a33"/>
    <rect x="34" y="322" width="42" height="20" rx="10" fill="#e5484d"/><text x="55" y="336" text-anchor="middle" fill="#fff" font-weight="700">P0</text>
    <text x="112" y="336" fill="#e6e9ed">R2 expression-injection</text>
    <text x="205" y="336" fill="#4f8cc9" font-family="Consolas, monospace" font-size="10.5">vulnerable.yml:25</text>
    <text x="430" y="336" fill="#e6e9ed">CRITICAL <tspan fill="#e5484d" font-weight="700">↑</tspan></text>
    <text x="540" y="336" fill="#46a758">HIGH</text>
    <text x="650" y="336" fill="#e5484d" font-weight="700">YES</text>
    <text x="745" y="336" fill="#c8d1dc">PR title → run shell line</text>

    <line x1="30" y1="352" x2="890" y2="352" stroke="#232a33"/>
    <rect x="34" y="364" width="42" height="20" rx="10" fill="#e5484d"/><text x="55" y="378" text-anchor="middle" fill="#fff" font-weight="700">P0</text>
    <text x="112" y="378" fill="#e6e9ed">R5 secret-echoed</text>
    <text x="205" y="378" fill="#4f8cc9" font-family="Consolas, monospace" font-size="10.5">vulnerable.yml:27</text>
    <text x="430" y="378" fill="#e6e9ed">CRITICAL <tspan fill="#e5484d" font-weight="700">↑</tspan></text>
    <text x="540" y="378" fill="#46a758">HIGH</text>
    <text x="650" y="378" fill="#e5484d" font-weight="700">YES</text>
    <text x="745" y="378" fill="#c8d1dc">secret written to job log</text>

    <line x1="30" y1="394" x2="890" y2="394" stroke="#232a33"/>
    <rect x="34" y="406" width="42" height="20" rx="10" fill="#e8883a"/><text x="55" y="420" text-anchor="middle" fill="#fff" font-weight="700">P1</text>
    <text x="112" y="420" fill="#e6e9ed">R2 expression-injection</text>
    <text x="205" y="420" fill="#4f8cc9" font-family="Consolas, monospace" font-size="10.5">push-injection.yml:14</text>
    <text x="430" y="420" fill="#e6e9ed">HIGH</text>
    <text x="540" y="420" fill="#46a758">HIGH</text>
    <text x="650" y="420" fill="#9aa4b2">no</text>
    <text x="745" y="420" fill="#c8d1dc">same sink, push trigger</text>

    <line x1="30" y1="436" x2="890" y2="436" stroke="#232a33"/>
    <rect x="34" y="448" width="42" height="20" rx="10" fill="#e8883a"/><text x="55" y="462" text-anchor="middle" fill="#fff" font-weight="700">P1</text>
    <text x="112" y="462" fill="#e6e9ed">R4 write-all</text>
    <text x="205" y="462" fill="#4f8cc9" font-family="Consolas, monospace" font-size="10.5">vulnerable.yml:15</text>
    <text x="430" y="462" fill="#e6e9ed">HIGH <tspan fill="#e5484d" font-weight="700">↑</tspan></text>
    <text x="540" y="462" fill="#46a758">HIGH</text>
    <text x="650" y="462" fill="#e5484d" font-weight="700">YES</text>
    <text x="745" y="462" fill="#c8d1dc">token gets every scope</text>
  </g>

  <text x="30" y="516" fill="#6f7d8f" font-size="10.5">↑ escalated: same misconfiguration, one severity higher because attacker-controllable input reaches the job</text>
  <text x="30" y="536" fill="#6f7d8f" font-size="10.5">identical injection: CRITICAL/P0 under pull_request_target · HIGH/P1 under push — context is the point</text>
</svg>
